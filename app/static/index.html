<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SirenDex — SpiderDex Live Incident Map</title>
  <link rel="preconnect" href="https://api.mapbox.com"><link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css">
  <style>
    :root{--bg:#07090d;--panel:#0e1219;--line:#202734;--ink:#eef2f8;--muted:#8590a3;--acid:#b8ff39;--danger:#ff4567;--fire:#ff9238;--burg:#ad7cff;--assault:#40c8ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{height:74px;display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.96);z-index:1001}.brand{display:flex;align-items:center;gap:10px;min-width:220px}.brandmark{width:40px;height:40px;display:grid;place-items:center;border:1px solid #354052;border-radius:12px;background:#111721;font-size:21px;box-shadow:0 0 32px #b8ff3922}.brand b{letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:3px}.search{display:flex;gap:8px;flex:1;max-width:720px}.search input{flex:1;min-width:140px}.control{height:44px;border:1px solid #30394a;background:#111721;color:var(--ink);border-radius:11px;padding:0 13px;font:inherit}.control:focus{outline:2px solid var(--acid);outline-offset:1px}button.control{cursor:pointer;font-weight:750}.primary{background:var(--acid);color:#071000;border-color:var(--acid)}.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:#a8b1bf;font:700 11px ui-monospace,monospace}.pulse{width:9px;height:9px;border-radius:50%;background:#50e78b;box-shadow:0 0 0 6px #50e78b1b;animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px transparent}}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}.mapwrap{position:relative;min-width:0}#map{position:absolute;inset:0;background:#0b0e14}.overlay{position:absolute;z-index:500;top:18px;left:18px;display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #384153;background:#111721e8;color:#cbd2dd;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer;backdrop-filter:blur(12px)}.chip.off{opacity:.4}.sidebar{border-left:1px solid var(--line);background:var(--panel);overflow:auto}.scorebox{padding:22px;border-bottom:1px solid var(--line)}.eyebrow{font:800 10px ui-monospace,monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.scoreline{display:flex;align-items:end;justify-content:space-between;margin:8px 0}.score{font-size:70px;line-height:.9;font-weight:900;letter-spacing:-.06em}.label{font:900 13px ui-monospace,monospace;padding:7px 10px;border-radius:7px;background:#252c38}.meter{height:7px;border-radius:10px;background:#272e39;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acid),#ffd33d,var(--danger));transition:width .7s cubic-bezier(.2,.8,.2,1)}.note{font-size:11px;line-height:1.5;color:var(--muted);margin:10px 0 0}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}.stat{padding:9px 4px;text-align:center;background:#121721;border-radius:9px}.stat b{display:block;font-size:18px}.stat small{font-size:9px;color:var(--muted);text-transform:uppercase}.feedhead{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 9px}.feedhead span{font-size:11px;color:var(--muted)}#feed{padding:0 12px 30px}.card{display:grid;grid-template-columns:42px 1fr;gap:11px;padding:13px 8px;border-bottom:1px solid #202631}.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#1a202b;font-size:19px}.card h3{font-size:13px;line-height:1.35;margin:1px 0 5px}.card p{color:#9aa5b6;font-size:11px;line-height:1.45;margin:0 0 8px}.meta{display:flex;gap:8px;align-items:center;font:700 9px ui-monospace,monospace;color:#737f91;text-transform:uppercase}.meta a{color:var(--acid);text-decoration:none}.empty{padding:30px;color:var(--muted);text-align:center}.loading{position:absolute;z-index:900;inset:0;background:#07090dcc;display:none;place-items:center;text-align:center}.loading.on{display:grid}.spinner{font-size:42px;animation:spin 1.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.mapboxgl-ctrl-attrib{background:#090c12dd!important;color:#718096!important}.mapboxgl-ctrl-attrib a{color:#9badc8!important}.mapboxgl-popup-content{background:#111721;color:#eef2f8;border-radius:10px}.mapboxgl-popup-tip{border-top-color:#111721!important;border-bottom-color:#111721!important}.mapboxgl-popup-close-button{color:#eef2f8}.marker-wrap{cursor:pointer}.marker{width:35px;height:35px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 5px 20px #0008}.marker span{transform:rotate(45deg);font-size:16px}
    @media(max-width:850px){body{overflow:auto}.shell{height:auto;min-height:100vh}.top{height:auto;flex-wrap:wrap}.brand{min-width:auto}.search{order:3;flex-basis:100%;max-width:none}.live{margin-left:auto}.main{display:block}.mapwrap{height:54vh}.sidebar{border-left:0;border-top:1px solid var(--line)}.score{font-size:58px}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand"><div class="brandmark">🚨</div><div><b>SIRENDEX</b><small>LIVE INCIDENT MAP</small></div></div>
    <form class="search" id="search"><input class="control" id="area" value="Shibuya, Tokyo" aria-label="Area"><select class="control" id="days"><option value="1">24H</option><option value="7" selected>7 DAYS</option><option value="30">30 DAYS</option></select><button class="control primary">SCAN AREA</button><button type="button" class="control" id="locate" title="Use my location">⌖</button></form>
    <button class="control" id="alerts">🔕 ALERTS</button><div class="live"><i class="pulse"></i><span id="status">LIVE WEB</span></div>
  </header>
  <main class="main"><section class="mapwrap"><div id="map"></div><div class="overlay" id="filters"></div><div class="loading" id="loading"><div><div class="spinner">🕸️</div><b>CRAWLING THE OPEN WEB</b><p class="note">Tavily is checking recent public reports…</p></div></div></section>
    <aside class="sidebar"><section class="scorebox"><div class="eyebrow">Incident Activity Index</div><div class="scoreline"><div class="score" id="score">—</div><div class="label" id="label">SCANNING</div></div><div class="meter"><i id="meter"></i></div><p class="note" id="explain">A recency-weighted signal from public reports — not a crime rate or prediction.</p></section>
      <div class="statrow" id="stats"></div><div class="feedhead"><b>RECENT REPORTS</b><span id="updated">—</span></div><div id="feed"><div class="empty">Choose an area to begin.</div></div></aside>
  </main>
</div>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script>
const CFG={assault:{emoji:'⚠️',color:'#40c8ff',label:'ASSAULT'},murder:{emoji:'💀',color:'#ff4567',label:'MURDER'},burglary:{emoji:'🥷🏻',color:'#ad7cff',label:'BURGLARY'},fire:{emoji:'🔥',color:'#ff9238',label:'FIRE'}};
let data=null,markers=[],known=new Set(),active=new Set(Object.keys(CFG)),first=true,mapReady=false,map=null;
async function initMap(){try{const r=await fetch('/api/config');const {mapbox_access_token:token}=await r.json();if(!token)throw Error('Add MAPBOX_ACCESS_TOKEN=pk.… to .env');mapboxgl.accessToken=token;map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',center:[139.6503,35.6762],zoom:11});map.addControl(new mapboxgl.NavigationControl(),'bottom-left');await new Promise((resolve,reject)=>{map.once('load',resolve);map.once('error',e=>reject(e.error||Error('Mapbox GL failed to load')))});mapReady=true;if(data)document.querySelector('#status').textContent=sourceStatus(data);render()}catch(e){document.querySelector('#status').textContent='MAPBOX KEY NEEDED';console.error(e.message)}}
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const sourceStatus=next=>next.fixture?'DEMO FIXTURE':next.partners.tavily.status==='snapshot'?'TAVILY SNAPSHOT · HOST NETWORK BLOCKED':`TAVILY LIVE · DAYTONA ${next.partners.daytona.checked_sources} CHECKED`;
document.querySelector('#filters').innerHTML=Object.entries(CFG).map(([k,v])=>`<button class="chip" data-cat="${k}">${v.emoji} ${v.label}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active.has(b.dataset.cat)?active.delete(b.dataset.cat):active.add(b.dataset.cat);b.classList.toggle('off');render()});
function markerElement(cat){const c=CFG[cat]||CFG.assault;const el=document.createElement('div');el.className='marker-wrap';el.innerHTML=`<div class="marker" style="background:${c.color}"><span>${c.emoji}</span></div>`;return el}
function render(){if(!data)return;markers.forEach(m=>m.remove());markers=[];const rows=data.incidents.filter(x=>active.has(x.category));if(mapReady){for(const x of rows){const popup=new mapboxgl.Popup({offset:24}).setHTML(`<b>${esc(x.title)}</b><br><small>Approximate report area</small><br><a href="${esc(x.source_url)}" target="_blank" rel="noopener">Open source ↗</a>`);const m=new mapboxgl.Marker({element:markerElement(x.category),anchor:'bottom'}).setLngLat([x.lng,x.lat]).setPopup(popup).addTo(map);markers.push(m)}}
 document.querySelector('#feed').innerHTML=rows.length?rows.map(x=>{const c=CFG[x.category]||CFG.assault;return `<article class="card"><div class="icon" style="box-shadow:inset 3px 0 ${c.color}">${c.emoji}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="meta"><span>${esc(c.label)}</span><span>${esc(x.source_type)}</span>${x.source_verified?'<span style="color:#50e78b">✓ DAYTONA</span>':''}<a href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc(x.source_name)} ↗</a></div></div></article>`}).join(''):'<div class="empty">No reports match these filters.</div>';
 const counts=Object.fromEntries(Object.keys(CFG).map(k=>[k,data.incidents.filter(x=>x.category===k).length]));document.querySelector('#stats').innerHTML=Object.entries(CFG).map(([k,v])=>`<div class="stat"><b>${counts[k]}</b><small>${v.emoji} ${v.label}</small></div>`).join('')}
async function load(){const area=document.querySelector('#area').value.trim(),days=document.querySelector('#days').value;if(!area)return;document.querySelector('#loading').classList.add('on');try{const r=await fetch(`/api/incidents?area=${encodeURIComponent(area)}&days=${days}`);if(!r.ok)throw Error(await r.text());const next=await r.json();const fresh=next.incidents.filter(x=>!known.has(x.id));data=next;next.incidents.forEach(x=>known.add(x.id));if(mapReady)map.flyTo({center:[next.center.lng,next.center.lat],zoom:12});document.querySelector('#score').textContent=next.activity.score;document.querySelector('#label').textContent=next.activity.label;document.querySelector('#meter').style.width=next.activity.score+'%';document.querySelector('#explain').textContent=next.activity.explanation+' '+next.disclaimer;document.querySelector('#updated').textContent=new Date(next.refreshed_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});document.querySelector('#status').textContent=!mapReady?'MAPBOX KEY NEEDED':sourceStatus(next);render();if(!first&&fresh.length&&Notification.permission==='granted')new Notification(`SirenDex: ${fresh.length} new report${fresh.length>1?'s':''}`,{body:`New public reports near ${next.area}`});first=false}catch(e){document.querySelector('#feed').innerHTML=`<div class="empty">Scan failed: ${esc(e.message)}</div>`}finally{document.querySelector('#loading').classList.remove('on')}}
document.querySelector('#search').onsubmit=e=>{e.preventDefault();known.clear();first=true;load()};document.querySelector('#alerts').onclick=async()=>{if(!('Notification'in window))return alert('Notifications are not supported here.');const p=await Notification.requestPermission();document.querySelector('#alerts').textContent=p==='granted'?'🔔 ALERTS ON':'🔕 ALERTS'};
document.querySelector('#locate').onclick=()=>navigator.geolocation?.getCurrentPosition(async p=>{const {latitude,longitude}=p.coords;if(mapReady)map.flyTo({center:[longitude,latitude],zoom:13});try{const r=await fetch(`/api/reverse-geocode?lat=${latitude}&lng=${longitude}`);const g=await r.json();if(!r.ok)throw Error(g.detail||'Location lookup failed');document.querySelector('#area').value=g.area;known.clear();first=true;load()}catch(e){alert(e.message)}},()=>alert('Location permission was not granted.'));
initMap();load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></body></html>
