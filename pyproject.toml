[project]
name = "hackathon-starter"
version = "0.1.0"
description = "Two-hour Agent Forge starter with Tavily and sponsor-ready adapters"
requires-python = ">=3.11"
dependencies = [
  "daytona>=0.100",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "tavily-python>=0.7",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
